minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@kikiutils/eslint-config' # TODO: remove it

resolutionMode: highest

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

strictSsl: true
preferFrozenLockfile: true
shellEmulator: true
updateNotifier: false

packages:
  - playground

overrides:
  typescript: ^6.0.3

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
